# Tier 2: real-platform tests on self-hosted VM runners (issue #33).
# Security: push/dispatch triggers only — never pull_request, so fork PRs
# can never execute code on the self-hosted machines.
name: CI (self-hosted)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  linux-vm:
    runs-on: [self-hosted, linux, vm]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        run: |
          zig build && zig build demos check
          zig build test
      - name: Environment smoke check
        run: |
          echo "Display: ${DISPLAY:-none}"
          uname -a

      - name: E2E OS dark-mode theming follows color-scheme (#318)
        run: |
          # The docs app reads the OS light/dark preference at startup, so flip it
          # and assert the rendered frame tracks it. A private D-Bus session makes
          # `gsettings set` and the app's gsettings fallback share one dconf (a bare
          # session has no portal → this exercises the fallback path); one frame per
          # mode is captured via ZOOEE_CAPTURE under Xvfb + software GL.
          set -euo pipefail
          if ! command -v gsettings >/dev/null || ! command -v dbus-run-session >/dev/null; then
            echo "skip: gsettings / dbus-run-session not available on this runner"; exit 0
          fi
          dbus-run-session -- bash -c '
            set -e
            for mode in dark light; do
              [ "$mode" = dark ] && scheme=prefer-dark || scheme=prefer-light
              gsettings set org.gnome.desktop.interface color-scheme "$scheme"
              xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ZOOEE_CAPTURE="docs-$mode.ppm" ./zig-out/bin/zooee-docs-demo
            done
          '
          ./zig-out/bin/visual-diff --darker docs-dark.ppm docs-light.ppm

      - name: Upload dark-mode captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-darkmode-capture
          path: |
            docs-dark.ppm
            docs-light.ppm
          if-no-files-found: ignore

  windows-vm:
    runs-on: [self-hosted, windows, vm]
    defaults:
      run:
        # The VM's PowerShell execution policy is Restricted; scope a bypass
        # to this workflow's steps instead of weakening the host setting.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        run: |
          zig build; zig build demos check
          zig build test
      - name: Interactive session check
        run: |
          $sid = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Host "Runner session id: $sid"
          if ($sid -eq 0) {
            Write-Warning "Running in session 0 - no interactive desktop. Windowing tests will not work until auto-logon setup is complete."
          } else {
            Write-Host "Interactive session OK - desktop available."
          }

      - name: Visual golden test
        run: zig build visual-test

      - name: D3D11 backend self-check (WARP)
        run: |
          & "zig-out\bin\zooee-d3d11-check.exe"
          if ($LASTEXITCODE -ne 0) { throw "d3d11 self-check failed" }

      - name: E2E on-screen window render (GUI demo)
        run: |
          # Launch the real GUI demo, screenshot its on-screen window, and
          # assert it actually painted content — a blank/solid window means
          # the GPU present loop regressed (the "opens blank then closes" bug).
          # ZOOEE_WINLOG records which present path the (console-less) GUI app
          # took (d3d swapchain vs raster+GDI fallback) for diagnosis.
          $env:ZOOEE_WINLOG = "winpath.log"
          $demo = Start-Process -FilePath "zig-out\bin\zooee-gui-demo.exe" -PassThru
          Start-Sleep -Seconds 2  # let the window open and render its first frame
          if (Test-Path winpath.log) { Write-Host "window path: $(Get-Content winpath.log -Raw)" }
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File ci\capture-window.ps1 -TitlePattern "*zooee*" -OutFile window.bmp
            & "zig-out\bin\visual-diff.exe" --reject-solid 255,255,255 window.bmp
            if ($LASTEXITCODE -ne 0) { throw "GUI window blank or capture failed" }
          } finally {
            Stop-Process -Id $demo.Id -Force -ErrorAction SilentlyContinue
          }

      - name: E2E on-hardware resize regression (maximize) (#97)
        run: |
          # Lock in the window-resize fix (PR #94) on real hardware: launch the
          # GUI demo, capture at the default size, then MAXIMIZE the window and
          # recapture. Assert the maximized client rect is strictly larger AND
          # still non-blank. A swapchain that wasn't ResizeBuffers'd would
          # stretch a stale frame / go blank / freeze on WM_SIZE — all caught
          # here (the layout-reflow invariant itself is unit-tested, #99).
          $env:ZOOEE_WINLOG = "winpath-resize.log"
          $demo = Start-Process -FilePath "zig-out\bin\zooee-gui-demo.exe" -PassThru
          Start-Sleep -Seconds 2
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File ci\capture-window.ps1 -TitlePattern "*zooee*" -OutFile before.bmp
            powershell -NoProfile -ExecutionPolicy Bypass -File ci\capture-window.ps1 -TitlePattern "*zooee*" -OutFile after.bmp -Maximize
            & "zig-out\bin\visual-diff.exe" --reject-solid 255,255,255 after.bmp
            if ($LASTEXITCODE -ne 0) { throw "maximized window blank - resize regressed (stale/blank frame)" }
            $b = (Get-Content before.bmp.size) -split 'x'
            $a = (Get-Content after.bmp.size)  -split 'x'
            Write-Host "client size before=$($b -join 'x') after=$($a -join 'x')"
            if ([int]$a[0] -le [int]$b[0] -or [int]$a[1] -le [int]$b[1]) {
              throw "window did not grow on maximize (before=$($b -join 'x') after=$($a -join 'x')) - WM_SIZE/present loop stuck"
            }
          } finally {
            Stop-Process -Id $demo.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload window capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-capture
          path: |
            window.bmp
            winpath.log
            before.bmp
            after.bmp
            winpath-resize.log
          if-no-files-found: ignore

      # D3D11 GPU window (#12): the interactive session has a desktop, so the
      # DXGI swapchain succeeds here (unlike headless SSH). ZOOEE_CAPTURE makes
      # runWindow render one frame through the D3D11 GPU path, read the back
      # buffer, and write a PPM — present only when the GPU path actually ran
      # (absent on a raster fallback).
      - name: D3D11 GPU window capture
        run: |
          $env:ZOOEE_CAPTURE = "d3d_window.ppm"
          Start-Process -FilePath "zig-out\bin\zooee-gui-demo.exe" -Wait
          if (-not (Test-Path d3d_window.ppm)) {
            throw "no D3D capture - GPU swapchain path did not run (raster fallback?)"
          }
          Write-Host "D3D11 GPU window captured: $((Get-Item d3d_window.ppm).Length) bytes"

      - name: E2E OS dark-mode theming follows AppsUseLightTheme (#318)
        run: |
          # The docs app reads the OS light/dark preference at startup, so flip the
          # registry and assert the rendered frame tracks it. ZOOEE_CAPTURE renders
          # one frame to a PPM via the D3D path (works in this interactive session).
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          $orig = (Get-ItemProperty -Path $key -Name AppsUseLightTheme -ErrorAction SilentlyContinue).AppsUseLightTheme
          try {
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value 0 -Type DWord
            $env:ZOOEE_CAPTURE = "docs-dark.ppm"
            Start-Process -FilePath "zig-out\bin\zooee-docs-demo.exe" -Wait
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value 1 -Type DWord
            $env:ZOOEE_CAPTURE = "docs-light.ppm"
            Start-Process -FilePath "zig-out\bin\zooee-docs-demo.exe" -Wait
            if (-not (Test-Path docs-dark.ppm) -or -not (Test-Path docs-light.ppm)) {
              throw "docs capture missing (GPU swapchain path did not run?)"
            }
            & "zig-out\bin\visual-diff.exe" --darker docs-dark.ppm docs-light.ppm
            if ($LASTEXITCODE -ne 0) { throw "docs did not follow OS dark mode" }
          } finally {
            if ($null -ne $orig) {
              Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value $orig -Type DWord
            }
            Remove-Item Env:\ZOOEE_CAPTURE -ErrorAction SilentlyContinue
          }

      - name: Upload D3D window capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d-window-capture
          path: |
            d3d_window.ppm
            docs-dark.ppm
            docs-light.ppm
          if-no-files-found: ignore
