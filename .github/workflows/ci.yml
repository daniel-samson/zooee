name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check .

      - name: Install X11/GL (Linux backends + software GL for tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libgl1-mesa-dri xvfb

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Visual golden test
        run: zig build visual-test

      - name: GL context test (Linux, software GL)
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./zig-out/bin/zooee-gl-demo

      - name: Binary size gate
        shell: bash
        run: bash ci/check-size.sh

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.os }}
          path: testdata/visual/*.actual.ppm
          if-no-files-found: ignore
