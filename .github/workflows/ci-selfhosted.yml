# Tier 2: real-platform tests on self-hosted VM runners (issue #33).
# Security: push/dispatch triggers only — never pull_request, so fork PRs
# can never execute code on the self-hosted machines.
name: CI (self-hosted)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  linux-vm:
    runs-on: [self-hosted, linux, vm]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        run: |
          zig build && zig build demos check
          zig build test
      - name: Environment smoke check
        run: |
          echo "Display: ${DISPLAY:-none}"
          uname -a

  windows-vm:
    runs-on: [self-hosted, windows, vm]
    defaults:
      run:
        # The VM's PowerShell execution policy is Restricted; scope a bypass
        # to this workflow's steps instead of weakening the host setting.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and test
        run: |
          zig build; zig build demos check
          zig build test
      - name: Interactive session check
        run: |
          $sid = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Host "Runner session id: $sid"
          if ($sid -eq 0) {
            Write-Warning "Running in session 0 - no interactive desktop. Windowing tests will not work until auto-logon setup is complete."
          } else {
            Write-Host "Interactive session OK - desktop available."
          }

      - name: Visual golden test
        run: zig build visual-test

      - name: D3D11 backend self-check (WARP)
        run: |
          & "zig-out\bin\zooee-d3d11-check.exe"
          if ($LASTEXITCODE -ne 0) { throw "d3d11 self-check failed" }

      - name: E2E on-screen window render (GUI demo)
        run: |
          # Launch the real GUI demo, screenshot its on-screen window, and
          # assert it actually painted content — a blank/solid window means
          # the GPU present loop regressed (the "opens blank then closes" bug).
          # ZOOEE_WINLOG records which present path the (console-less) GUI app
          # took (d3d swapchain vs raster+GDI fallback) for diagnosis.
          $env:ZOOEE_WINLOG = "winpath.log"
          $demo = Start-Process -FilePath "zig-out\bin\zooee-gui-demo.exe" -PassThru
          Start-Sleep -Seconds 2  # let the window open and render its first frame
          if (Test-Path winpath.log) { Write-Host "window path: $(Get-Content winpath.log -Raw)" }
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File ci\capture-window.ps1 -TitlePattern "*zooee*" -OutFile window.bmp
            & "zig-out\bin\visual-diff.exe" --reject-solid 255,255,255 window.bmp
            if ($LASTEXITCODE -ne 0) { throw "GUI window blank or capture failed" }
          } finally {
            Stop-Process -Id $demo.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload window capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-capture
          path: |
            window.bmp
            winpath.log
          if-no-files-found: ignore

      # D3D11 GPU window (#12): the interactive session has a desktop, so the
      # DXGI swapchain succeeds here (unlike headless SSH). ZOOEE_CAPTURE makes
      # runWindow render one frame through the D3D11 GPU path, read the back
      # buffer, and write a PPM — present only when the GPU path actually ran
      # (absent on a raster fallback).
      - name: D3D11 GPU window capture
        run: |
          $env:ZOOEE_CAPTURE = "d3d_window.ppm"
          Start-Process -FilePath "zig-out\bin\zooee-gui-demo.exe" -Wait
          if (-not (Test-Path d3d_window.ppm)) {
            throw "no D3D capture - GPU swapchain path did not run (raster fallback?)"
          }
          Write-Host "D3D11 GPU window captured: $((Get-Item d3d_window.ppm).Length) bytes"

      - name: Upload D3D window capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d-window-capture
          path: d3d_window.ppm
          if-no-files-found: ignore
